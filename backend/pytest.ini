[pytest]
python_files = test_*.py
# The whole backend tree, rather than a hand-maintained list of app names: tests
# live in per-app `tests/` packages (docs/infra/project-structure.md) and a new
# app should not need a config edit to be tested.
testpaths = .
norecursedirs = .git .venv __pycache__ staticfiles

# `--ds=` and not the `DJANGO_SETTINGS_MODULE` ini key. Every container built
# from this image already has DJANGO_SETTINGS_MODULE=config.settings.local in its
# environment (docker-compose.yml), and pytest-django ranks the environment
# ABOVE the ini key -- so the ini key silently loses and the suite would run
# against the dev settings, with async Django-Q2 and the real password hashers.
# `--ds` is a command-line option, which outranks both.
addopts = --ds=config.settings.test --strict-markers
